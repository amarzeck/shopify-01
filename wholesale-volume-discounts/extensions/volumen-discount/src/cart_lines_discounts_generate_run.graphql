query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            # Tags de segmento del producto.
            hasTags(tags: ["Importado", "Nacional", "Maquinaria"]) {
              tag
              hasTag
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
  shop {
    # Tabla de tramos (JSON) como metafield de la tienda. Unica fuente de
    # verdad, compartida con el bloque de tema. Si no se puede leer, la
    # funcion usa DEFAULT_TIERS (respaldo quemado en el codigo).
    metafield(namespace: "inaltum", key: "volume_tiers") {
      jsonValue
    }
  }
}
